# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: 3

vars:
  # Get FORCE from environment or default to false.
  FORCE: '{{env "FORCE"}}'

tasks:
  install:
    desc: Install dotfiles
    summary: |
      Install dotfiles

      This task will install and configure all dotfiles (this includes creating symlinks and setting simple configurations).
    cmds:
      - task: ensure_dirs
      - task: link_dotfiles

  # Step 1: Ensure necessary directories exist before creating symlinks or applying configurations.
  ensure_dirs:
    internal: true
    cmds:
      - mkdir -p ~/bin
      - mkdir -p ~/.ssh
      - mkdir -p ~/.cargo

  # Step 2: Link dotfiles based on the platform (macOS or Linux).
  link_dotfiles:
    internal: true
    # TODO: Not sure I need platform specific
    # deps:
    #   - task: link_macos_dotfiles
    #   - task: link_linux_dotfiles
    vars:
      DOTFILES:
        # Atuin specific dotfiles.
        - "configs/atuin/config.toml|$HOME/.config/atuin/config.toml"
        # CURL specific dotfiles.
        - "configs/curl/.curlrc|$HOME/.curlrc"
        # EditorConfig specific dotfiles.
        - "configs/editorconfig/.editorconfig|$HOME/.editorconfig"
        # Ghostty specific dotfiles.
        # https://ghostty.org/docs/config#file-location
        - "configs/ghostty/config.ghostty|$HOME/.config/ghostty/config.ghostty"
        # GIT specific dotfiles.
        - "configs/git/.gitattributes|$HOME/.gitattributes"
        - "configs/git/.gitconfig.local|$HOME/.gitconfig.local"
        - "configs/git/.gitignore_global|$HOME/.gitignore_global"
        # JJ / Jujutsu specific dotfiles.
        - "configs/jujutsu/|$HOME/.config/jj"
        # Mise specific dotfiles.
        - "configs/mise/|$HOME/.config/mise"
        # ZSH specific dotfiles.
        - "configs/starship/starship.toml|$HOME/.config/starship.toml"
        # Television specific dotfiles.
        - "configs/television/config.toml|$HOME/.config/television/config.toml"
        - "configs/television/cable|$HOME/.config/television/cable"
        # Zellij specific dotfiles.
        - "configs/zellij/config.kdl|$HOME/.config/zellij/config.kdl"
        # Pi specific dotfiles.
        - "configs/pi/agent/extensions|$HOME/.pi/agent/extensions"
        - "configs/pi/agent/themes|$HOME/.pi/agent/themes"
        ## These symlinks are needed by the zsh.yml tasks.
        # Prezto symlinks (before I switched to zephyr)
        # - "configs/zsh/prezto/runcoms/zlogin|$HOME/.zlogin"
        # - "configs/zsh/prezto/runcoms/zlogout|$HOME/.zlogout"
        # - "configs/zsh/prezto/runcoms/zprofile|$HOME/.zprofile"
        # - "configs/zsh/prezto/runcoms/zshenv|$HOME/.zshenv"
        # - "configs/zsh/prezto/runcoms/zpreztorc|$HOME/.zpreztorc"
        - "configs/zsh/zephyr/runcoms/zlogin|$HOME/.zlogin"
        - "configs/zsh/zephyr/runcoms/zlogout|$HOME/.zlogout"
        - "configs/zsh/zephyr/runcoms/zprofile|$HOME/.zprofile"
        - "configs/zsh/zephyr/runcoms/zshenv|$HOME/.zshenv"
        # Main zshrc symlink (this is the main entry point for zsh configuration, and it sources the other runcoms).
        - "configs/zsh/.zshrc|$HOME/.zshrc"
    cmds:
      - for:
          var: DOTFILES
          as: DOTFILE
        task: util:link_dotfile
        vars:
          SRC: '{{splitList "|" .DOTFILE | first}}'
          DEST: '{{splitList "|" .DOTFILE | last}}'

  # This is a reusable task that creates a symlink from a source file/directory to a destination path.
  # It handles existing files, directories, and symlinks gracefully, and can forcefully replace them if needed.
  util:link_dotfile:
    internal: true
    silent: true
    vars:
      SRC: "{{.SRC}}"
      DEST: "{{.DEST}}"
    cmds:
      - |
        SRC_PATH="{{.ROOT_DIR}}/{{.SRC}}"
        DEST_PATH="{{.DEST}}"

        # Create parent directory if it doesn't exist
        mkdir -p "$(dirname "$DEST_PATH")"

        # If FORCE is true, remove the target
        if [ "{{.FORCE}}" = "true" ]; then
          rm -rf "$DEST_PATH"
        fi

        # Decide what to do when something else already lives at DEST_PATH.
        # Set ON_EXISTING=replace|skip to avoid the prompt (default: ask when
        # a terminal is available, otherwise skip and report).
        resolve_conflict() {
          case "${ON_EXISTING:-ask}" in
            replace) return 0 ;;
            skip) return 1 ;;
          esac
          if (: < /dev/tty) 2>/dev/null; then
            printf '%s already exists (%s). Replace it? [y/N] ' "$DEST_PATH" "$1" > /dev/tty
            read -r answer < /dev/tty || answer=""
            case "$answer" in [yY]*) return 0 ;; esac
          fi
          return 1
        }

        skip_existing() {
          echo "SKIPPED: $DEST_PATH already exists ($1), not linked to $SRC_PATH"
          echo "         re-run with ON_EXISTING=replace to overwrite, or FORCE=true"
        }

        if [ -L "$DEST_PATH" ]; then
          current=$(readlink "$DEST_PATH")

          if [ "$current" = "$SRC_PATH" ]; then
            :  # already linked correctly
          elif [ ! -e "$DEST_PATH" ]; then
            echo "$DEST_PATH is a broken symlink, replacing it"
            rm "$DEST_PATH"
            ln -s "$SRC_PATH" "$DEST_PATH"
          elif resolve_conflict "symlink to $current"; then
            echo "replacing $DEST_PATH (was symlink to $current)"
            rm "$DEST_PATH"
            ln -s "$SRC_PATH" "$DEST_PATH"
          else
            skip_existing "symlink to $current"
          fi
        elif [ -e "$DEST_PATH" ]; then
          if resolve_conflict "not a symlink"; then
            echo "replacing $DEST_PATH (was not a symlink)"
            rm -rf "$DEST_PATH"
            ln -s "$SRC_PATH" "$DEST_PATH"
          else
            skip_existing "not a symlink"
          fi
        else
          echo "creating link for $DEST_PATH"
          ln -s "$SRC_PATH" "$DEST_PATH"
        fi
